<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glassworks Workroom | Operations CRM prototype</title>
<meta name="description" content="Operations CRM prototype for Glassworks London: recruitment, people, training, ecommerce, stock, content, meetings, tasks, SOPs, files, decisions, IT and AI workflows.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231F5C4A'/><text x='16' y='22' font-size='17' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>G</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --sunk:#F8F9F7; --ink:#17201B; --ink2:#38433D; --muted:#66716B; --faint:#959E98;
  --line:#E2E6E1; --line2:#EEF0ED;
  --brand:#1F5C4A; --brand-2:#174637; --brand-soft:#E4F0EA; --brand-tint:#F1F7F4;
  --ok:#21734D; --ok-s:#DDF1E5; --warn:#94620B; --warn-s:#FBEFD5; --bad:#B2382B; --bad-s:#FBE3DF;
  --info:#2B5C8F; --info-s:#E3EDF8; --vio:#64479A; --vio-s:#EEE8F7; --blush:#9A4F3B; --blush-s:#F7E4DC; --neu:#56615B; --neu-s:#ECEFEC;
  --font:'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:13.5px/1.5 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:5px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}

/* Sidebar */
.side{background:#0F2C24;color:#CFE0D8;border-right:0;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:18px 16px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo .mk{width:34px;height:34px;border-radius:10px;background:#F3EDE4;color:#0F2C24;display:grid;place-items:center;font-weight:800;font-size:16px}
.logo b{display:block;font-size:15px;letter-spacing:-.01em;color:#fff}
.logo span{display:block;color:#8FB3A4;font-size:12px;margin-top:-2px}
.navs{padding:10px 10px 14px;display:flex;flex-direction:column;gap:12px}
.ng p{margin:0 8px 4px;font-size:11px;font-weight:700;color:#6F9585;letter-spacing:.02em}
.ng a{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;color:#CFE0D8;font-weight:500;text-decoration:none}
.ng a:hover{background:rgba(255,255,255,.06);color:#fff;text-decoration:none}
.ng a[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.ng a span.l{flex:1}
.ng .n{font-size:11px;font-weight:800;padding:0 6px;border-radius:999px;background:var(--warn-s);color:var(--warn);min-width:18px;text-align:center;line-height:18px}
.side-foot{margin-top:auto;padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#7FA294}
.side-foot b{color:#fff}
.linkbtn{background:none;border:0;padding:0;color:#BFE0D0;font-weight:700;cursor:pointer;font-size:12px}

/* Top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;height:56px;padding:0 24px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .menu{display:none}
.gsearch{position:relative;flex:1;max-width:520px}
.gsearch input{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);padding:0 64px 0 34px}
.gsearch input:focus{background:#fff}
.gsearch .i{position:absolute;left:11px;top:10px;color:var(--faint)}
.gsearch kbd{position:absolute;right:10px;top:8px;font:600 11px var(--font);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:#fff}
.qres{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(23,32,27,.14);padding:6px;display:none;max-height:380px;overflow:auto}
.qres.show{display:block}
.qres button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer}
.qres button:hover,.qres button:focus-visible{background:var(--sunk)}
.qres .k{color:var(--faint);font-size:11.5px;margin-left:auto}
.top .sp{flex:1}
.ib{position:relative;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.ib .dotn{position:absolute;top:-5px;right:-5px;font-size:10.5px;font-weight:800;background:var(--warn);color:#fff;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.me{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px}
.proto{font-size:11.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:3px 9px;border-radius:999px;white-space:nowrap}
.menuwrap{position:relative}
.dd{position:absolute;right:0;top:42px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(23,32,27,.14);padding:6px;min-width:230px;display:none;z-index:40}
.dd.show{display:block}
.dd button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left;font-weight:500}
.dd button:hover{background:var(--sunk)}

/* Page */
main{min-width:0}
.page{padding:22px 24px 80px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ph .tt{display:flex;align-items:center;gap:12px}
.tile{width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.tile .i{width:19px;height:19px}
.ph h1{font-size:21px;font-weight:800;letter-spacing:-.015em;margin:0;line-height:1.2}
.ph p{margin:2px 0 0;color:var(--muted);max-width:80ch}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;white-space:nowrap;color:var(--ink2)}
.btn:hover{border-color:#C9D0CA;background:var(--sunk)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-tint)}
.btn.red{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:20px;background:var(--neu-s);color:var(--neu)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.nodot::before{display:none}
.t-ok{background:var(--ok-s);color:var(--ok)} .t-warn{background:var(--warn-s);color:var(--warn)} .t-bad{background:var(--bad-s);color:var(--bad)}
.t-info{background:var(--info-s);color:var(--info)} .t-vio{background:var(--vio-s);color:var(--vio)} .t-blush{background:var(--blush-s);color:var(--blush)}

.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:none;letter-spacing:.02em}
.av.lg{width:46px;height:46px;font-size:16px;border-radius:12px}
.who{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mt{margin-top:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.card-h h3{margin:0;font-size:13.5px;font-weight:700}
.card-b{padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gs{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

/* KPI strip */
.kpis{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.kpi{padding:13px 16px;border-left:1px solid var(--line2);text-align:left;background:none;border-top:0;border-bottom:0;border-right:0;cursor:default}
.kpi:first-child{border-left:0}
button.kpi{cursor:pointer} button.kpi:hover{background:var(--sunk)}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-top:2px}
.kpi .d{font-size:11.5px;font-weight:600;color:var(--faint)}
.kpi .v.bad{color:var(--bad)} .kpi .v.warn{color:var(--warn)} .kpi .v.ok{color:var(--ok)}

/* Object tabs & toolbar */
.otabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.otabs a{display:flex;align-items:center;gap:7px;padding:9px 12px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none;white-space:nowrap}
.otabs a[aria-current="page"]{color:var(--ink);border-color:var(--brand)}
.otabs .c{font-size:11px;background:var(--neu-s);color:var(--neu);border-radius:999px;padding:0 7px;line-height:18px}
.bar-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.seg button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-2)}
.views{display:flex;gap:4px;flex-wrap:wrap}
.views button{border:1px solid transparent;background:none;border-radius:7px;padding:5px 10px;font-weight:600;color:var(--muted);cursor:pointer}
.views button:hover{background:#fff;border-color:var(--line)}
.views button[aria-pressed="true"]{background:#fff;border-color:var(--line);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.views .c{color:var(--faint);font-weight:600;margin-left:3px}
.fin{height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 10px}
.lsearch{position:relative}
.lsearch input{padding-left:30px;width:170px}
.bar-t select.fin{max-width:150px}
.lsearch .i{position:absolute;left:9px;top:8px;color:var(--faint);width:15px;height:15px}

/* Table */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.tbl{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}
.tbl th{position:sticky;top:0;text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);padding:9px 12px;background:var(--sunk);border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.tbl th.s{cursor:pointer} .tbl th.s:hover{color:var(--ink)}
.tbl th .ar{opacity:.5;margin-left:3px}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:220px}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--brand-tint)}
.tbl tbody tr.sel td{background:#EAF3EE}
.tbl .ck{width:36px;padding-right:0}
.tbl input[type=checkbox]{width:15px;height:15px;accent-color:var(--brand);cursor:pointer}
.tbl tfoot td{background:var(--sunk);color:var(--muted);font-size:12px;border-bottom:0;cursor:default}
.prim{display:flex;align-items:center;gap:10px;min-width:220px}
.prim b{display:block;font-weight:700;color:var(--ink)}
.prim small{display:block;color:var(--muted);font-size:12px;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.idt{color:var(--faint);font-size:12px}
.empty{padding:36px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

/* Board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:#ECEFEB;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col.over{background:var(--brand-soft);outline:2px dashed var(--brand);outline-offset:-3px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:4px 6px}
.col-h b{font-size:12.5px}
.col-h .c{font-size:11.5px;color:var(--muted);font-weight:700}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;box-shadow:0 1px 2px rgba(23,32,27,.04)}
.kc:hover{border-color:#BFC8C1}
.kc[draggable="true"]{cursor:grab}
.kc.drag{opacity:.4}
.kc .t{font-weight:700;margin-bottom:2px;color:var(--ink)}
.kc .s{color:var(--muted);font-size:12px}
.kc .f{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px}

/* Bulk bar */
.bulk{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:10px;z-index:35;box-shadow:0 14px 40px rgba(0,0,0,.25);flex-wrap:wrap;max-width:calc(100vw - 24px)}
.bulk[hidden]{display:none}
.bulk select{height:30px;border-radius:7px;border:1px solid #3A4740;background:#25302A;color:#fff;padding:0 8px}
.bulk .btn{height:30px;background:#25302A;border-color:#3A4740;color:#fff}

/* Record page */
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-bottom:12px;flex-wrap:wrap}
.crumbs a{color:var(--muted);font-weight:600}
.rhead{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.rhead .top1{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.rhead h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.015em;line-height:1.25}
.rhead .sub{color:var(--muted);margin-top:2px}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-top:14px;border-top:1px solid var(--line2);padding-top:12px}
.hl div{padding-right:14px}
.hl span{display:block;color:var(--faint);font-size:11.5px;font-weight:700}
.hl b{font-weight:600}
.path{display:flex;margin-top:14px;gap:3px;overflow-x:auto}
.path button{flex:1;min-width:96px;height:34px;border:0;background:var(--neu-s);color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);padding:0 18px;white-space:nowrap}
.path button:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);border-radius:8px 0 0 8px}
.path button:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,12px 50%);border-radius:0 8px 8px 0}
.path button:hover{filter:brightness(.96)}
.path button.done{background:var(--brand-soft);color:var(--brand-2)}
.path button.cur{background:var(--brand);color:#fff}
.guide{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;background:var(--brand-tint);border:1px solid var(--brand-soft);border-radius:10px;padding:10px 14px;flex-wrap:wrap}
.guide b{font-size:12px;color:var(--brand-2)}
.guide p{margin:2px 0 0;color:var(--ink2)}
.flag{background:var(--bad-s);border-color:#F2CAC3}
.flag b{color:var(--bad)}
.rgrid{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:14px;margin-top:14px;align-items:start}
.props .pr{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--line2);align-items:center}
.props .pr:last-child{border-bottom:0}
.props .pl{color:var(--muted);font-size:12px;font-weight:600}
.pv{background:none;border:1px solid transparent;border-radius:6px;padding:3px 6px;margin:-4px -6px;text-align:left;cursor:pointer;min-height:26px;width:calc(100% + 12px);overflow-wrap:anywhere}
.pv:hover{border-color:var(--line);background:var(--sunk)}
.pv .ed{opacity:0;color:var(--faint);margin-left:4px}
.pv:hover .ed{opacity:1}
.props input,.props select,.props textarea{width:100%;height:30px;border:1px solid var(--brand);border-radius:6px;padding:0 8px;background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.props textarea{height:auto;padding:6px 8px}
.rtabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);padding:0 8px;overflow-x:auto}
.rtabs button{background:none;border:0;padding:11px 10px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.rtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--brand)}
.composer{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.composer textarea{width:100%;border:0;padding:10px 12px;min-height:64px;resize:vertical;outline:none}
.composer .cf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;background:var(--sunk);border-top:1px solid var(--line2)}
.tl{position:relative;display:flex;flex-direction:column;gap:14px}
.tl::before{content:"";position:absolute;left:13px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.ev{display:grid;grid-template-columns:28px 1fr;gap:10px;position:relative}
.ev .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--muted)}
.ev .ic .i{width:14px;height:14px}
.ev.note .ic{background:var(--warn-s);border-color:#F0DCA8;color:var(--warn)}
.ev.create .ic{background:var(--brand-soft);border-color:#C6DDD1;color:var(--brand)}
.ev.decision .ic{background:var(--vio-s);border-color:#DCD0EE;color:var(--vio)}
.ev .tx b{font-weight:700}
.ev .mt2{color:var(--faint);font-size:11.5px;margin-top:1px}
.ev .body{margin-top:5px;background:var(--sunk);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.daysep{font-size:11.5px;font-weight:700;color:var(--faint);padding-left:38px}
.rel .ri{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2)}
.rel .ri:last-child{border-bottom:0}
.rel .ri a{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.tk input{width:16px;height:16px;accent-color:var(--brand)}
.tk.done .tt{text-decoration:line-through;color:var(--faint)}
.addtk{display:grid;grid-template-columns:1fr 150px 140px auto;gap:6px;margin-top:10px}
.addtk input,.addtk select{height:32px;border:1px solid var(--line);border-radius:7px;padding:0 8px;background:#fff}

/* Scorecard etc */
.crit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.crit .nm{font-weight:700}
.crit .nm small{color:var(--faint);font-weight:600;margin-left:6px}
.s5{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}

function linkLegacyHires(){
  if(DB.hiringHandoffV1) return;

/* ================= Object engine ================= */
const OBJ = {};
const def = (k, o) => { o.key = k; o.fields = o.fields.map(f => ({type:'text', ...f})); OBJ[k] = o; return o; };
const coll = k => DB[k];
const getRec = (k, id) => (DB[k] || []).find(r => r.id === id);
const fieldOf = (o, k) => o.fields.find(f => f.k === k);
const isClosed = (o, r) => !!(o.status && (o.closed || []).includes(r[o.status]));
const isOverdue = (o, r) => !!(o.due && r[o.due] && !isClosed(o, r) && daysFrom(r[o.due]) < 0);
const isBlocked = (o, r) => !!(o.status && r[o.status] === 'Blocked') || !!(r.blocker && !isClosed(o, r) && o.key === 'content');
const recUrl = (k, id) => `#r/${k}/${id}`;
const recLink = (k, id, label) => { const r = getRec(k, id); return r ? `<a href="${recUrl(k,id)}">${esc(label ?? OBJ[k].title(r))}</a>` : '<span class="faint">—</span>'; };
const opts = f => typeof f.options === 'function' ? f.options() : (f.options || []);

function valueHtml(o, r, k){
  const c = o.computed && o.computed[k]; if (c) return c.f(r);
  const f = fieldOf(o, k); const v = r[k];
  if (!f) return esc(v ?? '');
  if (f.type === 'person') return who(v);
  if (f.type === 'date') return k === o.due ? dueChip(v, isClosed(o, r)) : (v ? fmt(v) : '<span class="faint">—</span>');
  if (f.type === 'ref') return v ? recLink(f.to, v) : '<span class="faint">—</span>';
  if (f.type === 'select') return f.plain ? esc(v || '—') : pill(v);
  if (f.type === 'number') return v == null || v === '' ? '<span class="faint">—</span>' : esc(v);
  if (f.type === 'textarea') return v ? `<span style="white-space:pre-wrap">${esc(v)}</span>` : '<span class="faint">—</span>';
  return v ? esc(v) : '<span class="faint">—</span>';
}
const colLabel = (o, k) => (o.computed && o.computed[k] && o.computed[k].l) || (fieldOf(o, k) || {}).l || k;
const sortVal = (o, r, k) => { const c = o.computed && o.computed[k]; if (c) return c.s ? c.s(r) : ''; const f = fieldOf(o, k); const v = r[k]; if (f && f.type === 'ref') { const t = getRec(f.to, v); return t ? OBJ[f.to].title(t) : ''; } return v ?? ''; };

function setField(k, id, field, val, quiet){
  const o = OBJ[k], r = getRec(k, id); if (!r) return;
  const f = fieldOf(o, field); const old = r[field];
  if (f && f.type === 'number') val = val === '' || val == null ? null : Number(val);
  if (String(old ?? '') === String(val ?? '')) return;
  if (o.guard && field === o.status) { const msg = o.guard(r, val); if (msg) { toast(msg); return false; } }
  r[field] = val;
  const lab = f ? f.l : field;
  const show = v => f && f.type === 'ref' ? (getRec(f.to, v) ? OBJ[f.to].title(getRec(f.to, v)) : 'empty') : f && f.type === 'date' ? (v ? fmtY(v) : 'empty') : (v === '' || v == null ? 'empty' : v);
  if (field === o.status) log(k, id, `${lab} changed to ${show(val)}`, 'change', `From ${show(old)}`);
  else log(k, id, `${lab} updated`, 'change', `${show(old)} → ${show(val)}`);
  o.onChange && o.onChange(r, field, old, val);
  save();
  if (!quiet) toast(`${lab}: ${show(val)}`);
}

/* ---------- UI state ---------- */
const UI = {view:{}, f:{}, sort:{}, sel:{}, rtab:{}, editing:null, extracted:null, notes:'', mtTitle:'', name:'', pack:{}};
const F = k => (UI.f[k] = UI.f[k] || {v:'all', owner:'', q:''});
const SEL = k => (UI.sel[k] = UI.sel[k] || new Set());

function viewsFor(o){
  if (o.views) return o.views;
  const v = [['all','All',()=>true]];
  if (o.closed) v.push(['open','Open',r=>!isClosed(o,r)]);
  if (o.due) v.push(['overdue','Overdue',r=>isOverdue(o,r)]);
  if (o.status && (o.stages||[]).includes('Blocked')) v.push(['blocked','Blocked',r=>r[o.status]==='Blocked']);
  if (o.owner) v.push(['mine','Mine',r=>r[o.owner]===ME]);
  return v;
}
function rowsFor(k){
  const o = OBJ[k], s = F(k); let rows = coll(k).slice();
  const v = viewsFor(o).find(x => x[0] === s.v) || viewsFor(o)[0]; rows = rows.filter(v[2]);
  if (s.owner && o.owner) rows = rows.filter(r => r[o.owner] === s.owner);
  if (s.q) { const q = s.q.toLowerCase(); rows = rows.filter(r => (o.title(r) + ' ' + (o.sub ? o.sub(r) : '') + ' ' + o.cols.map(c => sortVal(o, r, c)).join(' ') + ' ' + r.id).toLowerCase().includes(q)); }
  const so = UI.sort[k];
  if (so) rows.sort((a, b) => { const x = so.k === '__t' ? o.title(a) : sortVal(o, a, so.k), y = so.k === '__t' ? o.title(b) : sortVal(o, b, so.k); return (x > y ? 1 : x < y ? -1 : 0) * so.d; });
  return rows;
}

/* ---------- Table ---------- */
function tableHtml(k, rows){
  const o = OBJ[k], sel = SEL(k), so = UI.sort[k] || {};
  const arrow = c => so.k === c ? `<span class="ar">${so.d > 0 ? '↑' : '↓'}</span>` : '';
  if (!rows.length) return `<div class="tw"><div class="empty"><b>Nothing here</b><div class="mt"><button class="btn pri sm" data-act="new" data-o="${k}">${ic('plus')}New ${o.one.toLowerCase()}</button></div></div></div>`;
  const allSel = rows.every(r => sel.has(r.id));
  return `<div class="tw"><table class="tbl"><thead><tr>
    <th class="ck"><input type="checkbox" aria-label="Select all" data-chg="selAll" data-o="${k}" ${allSel?'checked':''}></th>
    <th class="s" data-act="sort" data-o="${k}" data-k="__t">${o.one}${arrow('__t')}</th>
    ${o.cols.map(c => `<th class="s" data-act="sort" data-o="${k}" data-k="${c}">${colLabel(o,c)}${arrow(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr data-act="open" data-o="${k}" data-id="${r.id}" tabindex="0" class="${sel.has(r.id)?'sel':''}">
      <td class="ck"><input type="checkbox" aria-label="Select ${esc(o.title(r))}" data-chg="sel" data-o="${k}" data-id="${r.id}" ${sel.has(r.id)?'checked':''}></td>
      <td><div class="prim">${o.avatar ? av(o.title(r)) : o.swatch ? o.swatch(r) : ''}<div><b>${esc(o.title(r))}</b><small>${o.sub ? esc(o.sub(r)) : ''}${o.sub?' · ':''}<span class="idt">${r.id}</span></small></div></div></td>
      ${o.cols.map(c => `<td>${valueHtml(o, r, c)}</td>`).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="${o.cols.length + 2}">${rows.length} ${rows.length === 1 ? o.one.toLowerCase() : o.label.toLowerCase()}${o.calc ? ' · ' + o.calc(rows) : ''}</td></tr></tfoot></table></div>`;
}

/* ---------- Board ---------- */
function boardHtml(k, rows){
  const o = OBJ[k];
  return `<div class="board" data-o="${k}">${o.stages.map(s => { const rs = rows.filter(r => r[o.status] === s);
    return `<div class="col" data-stage="${esc(s)}"><div class="col-h"><span class="row" style="gap:6px">${pill(s)}</span><span class="c">${rs.length}</span></div>
    ${rs.map(r => `<button class="kc" draggable="true" data-id="${r.id}" data-act="open" data-o="${k}" style="border-left-color:${o.accent ? o.accent(r) : 'var(--line)'}">
      <div class="row" style="gap:8px;flex-wrap:nowrap;align-items:flex-start">${o.avatar?av(o.title(r)):o.swatch?o.swatch(r):''}<div style="min-width:0"><div class="t">${esc(o.title(r))}</div><div class="s">${o.sub ? esc(o.sub(r)) : r.id}</div></div></div>
      ${o.card ? `<div style="margin-top:6px">${o.card(r)}</div>` : ''}
      <div class="f">${o.owner ? (r[o.owner] ? `<span class="who small">${av(r[o.owner])}${esc(r[o.owner].split(' ')[0])}</span>` : '<span class="faint small">Unassigned</span>') : ''}${o.due ? dueChip(r[o.due], isClosed(o, r)) : ''}</div></button>`).join('')}</div>`; }).join('')}</div>`;
}
function bindBoards(){
  document.querySelectorAll('.board').forEach(b => {
    const k = b.dataset.o, o = OBJ[k];
    b.querySelectorAll('.kc').forEach(c => {
      c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.id); c.classList.add('drag'); });
      c.addEventListener('dragend', () => c.classList.remove('drag')); });
    b.querySelectorAll('.col').forEach(col => {
      col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', () => col.classList.remove('over'));
      col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('over'); setField(k, e.dataTransfer.getData('text/plain'), o.status, col.dataset.stage); render(true); }); });
  });
}

/* ---------- Forms & modal ---------- */
function fieldInput(f, v, idp='f'){
  const id = idp + '_' + f.k, val = v ?? '';
  if (f.type === 'select') return `<select id="${id}" name="${f.k}">${f.blank?'<option value=""></option>':''}${opts(f).map(x=>`<option ${String(x)===String(val)?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  if (f.type === 'person') return `<select id="${id}" name="${f.k}"><option value="">Unassigned</option>${OWNERS.map(x=>`<option ${x===val?'selected':''}>${x}</option>`).join('')}</select>`;
  if (f.type === 'ref') return `<select id="${id}" name="${f.k}"><option value="">None</option>${coll(f.to).map(r=>`<option value="${r.id}" ${r.id===val?'selected':''}>${esc(OBJ[f.to].title(r))}</option>`).join('')}</select>`;
  if (f.type === 'textarea') return `<textarea id="${id}" name="${f.k}" rows="${f.rows||3}">${esc(val)}</textarea>`;
  return `<input id="${id}" name="${f.k}" type="${f.type==='date'?'date':f.type==='number'?'number':'text'}" value="${esc(val)}" ${f.req?'required':''} placeholder="${esc(f.ph||'')}">`;
}
function openModal(title, body, foot){
  $('#modal').innerHTML = `<div class="mh"><h2>${esc(title)}</h2><button class="xb" data-act="closeModal" aria-label="Close">${ic('x')}</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}`;
  $('#scrim').classList.add('show');
  setTimeout(() => { const f = $('#modal').querySelector('input:not([type=checkbox]):not([type=radio]),select,textarea'); f && f.focus(); }, 30);
}
function closeModal(){ $('#scrim').classList.remove('show'); }
function form({title, note='', fields, values={}, submit='Save', onSave}){
  openModal(title, `<form id="mf">${note?`<p class="muted" style="margin:0 0 12px">${note}</p>`:''}<div class="fg">${fields.map(f=>`<label class="fl ${f.w||f.type==='textarea'?'w':''}" for="f_${f.k}"><span>${esc(f.l)}${f.req?' *':''}</span>${fieldInput(f, values[f.k] ?? f.def)}</label>`).join('')}</div><button type="submit" hidden></button></form>`,
    `<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="submitForm">${esc(submit)}</button>`);
  $('#mf').onsubmit = e => { e.preventDefault(); const fd = new FormData(e.target); const out = {};
    for (const f of fields) { out[f.k] = (fd.get(f.k) ?? '').toString().trim(); if (f.type === 'number') out[f.k] = out[f.k] === '' ? null : Number(out[f.k]); if (f.req && !out[f.k] && out[f.k] !== 0) { toast(`${f.l} is required`); return; } }
    closeModal(); onSave(out); save(); render(true); };
}
function newRecord(k, preset={}){
  const o = OBJ[k];
  const fields = o.fields.filter(f => f.form !== false);
  form({title:`New ${o.one.toLowerCase()}`, fields, values:{...(o.defaults ? o.defaults() : {}), ...preset}, submit:`Create ${o.one.toLowerCase()}`, onSave: v => {
    const r = {id:nextId(coll(k), o.pre), ...(o.defaults ? o.defaults() : {}), ...v};
    o.beforeCreate && o.beforeCreate(r);
    coll(k).unshift(r); log(k, r.id, `${o.one} created`, 'create');
    o.afterCreate && o.afterCreate(r);
    toast(`${o.one} created`); location.hash = recUrl(k, r.id); }});
}
function csv(k, rows){
  const o = OBJ[k]; const cols = ['__t', ...o.cols];
  const val = (r,c) => c === '__t' ? o.title(r) : String(sortVal(o, r, c));
  const lines = [['ID', ...cols.map(c => c==='__t'?o.one:colLabel(o,c))].join(','), ...rows.map(r => [r.id, ...cols.map(c=>val(r,c))].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(','))];
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'})); a.download = `glassworks-${k}.csv`; a.click(); } catch(e){}
  toast(`Exported ${rows.length} ${o.label.toLowerCase()} to CSV`);
}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove('show'), 2400); }

/* ---------- Record page ---------- */
function tasksFor(k, id){ return DB.tasks.filter(t => t.ref && t.ref.o === k && t.ref.id === id); }
function timelineFor(k, id){ return DB.activity.filter(a => a.ref && a.ref.o === k && a.ref.id === id).sort((a,b) => a.when < b.when ? 1 : -1); }
const EVI = {note:'note', call:'phone', email:'mail', meeting:'chat', create:'plus', change:'bolt', decision:'scale'};
function timelineHtml(k, id){
  const items = timelineFor(k, id); let last = '';
  if (!items.length) return '<p class="muted">No activity.</p>';
  return `<div class="tl">${items.map(a => { const d = a.when.slice(0,10); const sep = d !== last ? `<div class="daysep">${daysFrom(d)===0?'Today':daysFrom(d)===-1?'Yesterday':fmtY(d)}</div>` : ''; last = d;
    return sep + `<div class="ev ${a.type}"><div class="ic">${ic(EVI[a.type]||'dot')}</div><div class="tx"><div><b>${esc(a.t)}</b></div><div class="mt2">${esc(a.by||'')} at ${a.when.slice(11,16)}</div>${a.body?`<div class="body">${esc(a.body)}</div>`:''}</div></div>`; }).join('')}</div>`;
}
function propsHtml(k, r){
  const o = OBJ[k];
  return o.fields.filter(f => f.props !== false).map(f => {
    const key = `${k}|${r.id}|${f.k}`;
    if (UI.editing === key) return `<div class="pr"><span class="pl">${esc(f.l)}</span><div>${fieldInput(f, r[f.k], 'pe').replace('<select','<select data-chg="pset" data-o="'+k+'" data-id="'+r.id+'" data-k="'+f.k+'"').replace('<input','<input data-chg="pset" data-o="'+k+'" data-id="'+r.id+'" data-k="'+f.k+'"').replace('<textarea','<textarea data-chg="pset" data-o="'+k+'" data-id="'+r.id+'" data-k="'+f.k+'"')}</div></div>`;

}
function pathHtml(k, r){
  const o = OBJ[k]; if (!o.path) return '';
  const cur = r[o.status], idx = o.path.indexOf(cur);
  const off = idx < 0;
  const g = (o.guide || {})[cur];
  let nxt = !off && idx < o.path.length - 1 ? o.path[idx+1] : null;
  if (nxt && o.guard && o.guard(r, nxt)) nxt = null;
  return `<div class="path" role="group" aria-label="Stage">${o.path.map((s,i) => `<button class="${!off && i<idx?'done':i===idx?'cur':''}" data-act="setStage" data-o="${k}" data-id="${r.id}" data-v="${esc(s)}" aria-current="${i===idx?'step':'false'}">${!off && i<idx?'✓ ':''}${esc(s)}</button>`).join('')}</div>
  <div class="guide ${off?'flag':''}"><div style="flex:1;min-width:240px"><b>${off ? esc(cur) : 'Next step'}</b><p>${esc(off ? (r.blocker ? 'Waiting on: ' + r.blocker : (o.guide||{})[cur] || 'Off the main path.') : g || 'Keep the record up to date at this stage.')}</p></div>
  ${nxt ? `<button class="btn sm pri" data-act="setStage" data-o="${k}" data-id="${r.id}" data-v="${esc(nxt)}">Move to ${esc(nxt)}</button>` : ''}</div>`;
}
function relatedHtml(k, r){
  const o = OBJ[k]; const groups = o.related ? o.related(r) : [];
  return groups.map(g => { const ro = OBJ[g.o];
    return `<div class="card rel"><div class="card-h"><h3>${esc(g.l || ro.label)} <span class="faint">(${g.rows.length})</span></h3>${g.add ? `<button class="btn sm ghost" data-act="newRel" data-o="${g.o}" data-preset='${esc(JSON.stringify(g.add))}'>${ic('plus')}Add</button>` : ''}</div><div class="card-b" style="padding-top:4px;padding-bottom:4px">

}
function recordPage(k, id){
  const o = OBJ[k], r = getRec(k, id);

    : tab === 'tasks' ? tasksTab(k, id) : o.tabs.find(t => t.k === tab).render(r);
  return `<div class="crumbs"><a href="#${M.id||'home'}">${esc(M.name||'Home')}</a><span>/</span><a href="#${M.id||'home'}/${k}">${esc(o.label)}</a><span>/</span><span>${r.id}</span></div>

    <div><h1>${esc(o.title(r))}</h1><div class="sub">${o.sub ? esc(o.sub(r)) + ' · ' : ''}${r.id}</div><div class="row" style="margin-top:8px">${o.status ? pill(r[o.status]) : ''}${o.owner && r[o.owner] ? `<span class="who small">${av(r[o.owner])}${esc(r[o.owner])}</span>` : ''}${isOverdue(o,r) ? '<span class="pill t-bad nodot">Overdue</span>' : ''}</div></div></div>

function tasksTab(k, id){
  const ts = tasksFor(k, id).sort((a,b) => (a.status==='Done') - (b.status==='Done') || (a.due > b.due ? 1 : -1));
  return `${ts.length ? ts.map(t => `<div class="tk ${t.status==='Done'?'done':''}"><input type="checkbox" ${t.status==='Done'?'checked':''} data-chg="tkDone" data-id="${t.id}" aria-label="Complete"><div><a class="tt" href="${recUrl('tasks',t.id)}" style="color:inherit;font-weight:600">${esc(t.title)}</a><div class="small muted">${esc(t.owner||'Unassigned')}${t.status==='Blocked'?' · Blocked':''}</div></div>${dueChip(t.due, t.status==='Done')}</div>`).join('') : '<p class="muted">No tasks.</p>'}
  <div class="addtk"><input id="ntT" placeholder="New task" aria-label="Task title"><select id="ntO" aria-label="Owner">${OWNERS.map(n=>`<option ${n===ME?'selected':''}>${n}</option>`).join('')}</select><input id="ntD" type="date" value="${rel(3)}" aria-label="Due date"><button class="btn pri" data-act="addTask" data-o="${k}" data-id="${id}">Add</button></div>`;
}
/* ================= Object definitions ================= */
function score(c){
  let num = 0, den = 0, n = 0, gaps = 0;
  CRIT.forEach(k => { const s = (c.scores||{})[k.k]; if (s) { num += s*k.w; den += 5*k.w; n++; if (s >= 4 && !((c.evidence||{})[k.k]||'').trim()) gaps++; } });
  return {pct: den ? Math.round(num/den*100) : null, n, gaps};
}
const scoreChip = c => { const s=score(c); if(s.pct==null) return '<span class="faint">Not scored</span>'; const t=s.n<5?'t-info':s.pct>=75?'t-ok':s.pct>=55?'t-warn':'t-bad'; return '<span class="pill nodot '+t+'">'+(s.n<5?'Provisional · ':'')+s.pct+(s.n<5?' · '+s.n+'/5':' / 100')+'</span>'; };
const retail = () => DB.employees.filter(e => e.team === 'Retail' && e.status !== 'Leaver');
const cleared = id => DB.modules.filter(m => m.mandatory === 'Yes').every(m => ((DB.scores[id]||{})[m.id] ?? -1) >= m.pass);
const ago = s => { const n = -daysFrom(s); return n <= 0 ? 'today' : n === 1 ? '1 day' : n + ' days'; };
const tenure = s => { const d = -daysFrom(s); if (d < 60) return d + ' days'; const m = Math.floor(d/30.4); return m < 24 ? m + ' months' : Math.floor(m/12) + ' years'; };
const refLabel = ref => { if (!ref || !OBJ[ref.o]) return ''; const r = getRec(ref.o, ref.id); return r ? `${OBJ[ref.o].one}: ${OBJ[ref.o].title(r)}` : ''; };

def('employees', {label:'Employees', one:'Employee', pre:'EMP', avatar:true, title:r=>r.name, sub:r=>r.role,

function checkName(n){
  const base = n.replace(/\.[a-z0-9]+$/i,''), p = base.split('_');
  return [{ok:!/\s/.test(n),l:'No spaces'},{ok:p.length===4,l:'Four parts: AREA_Topic_Date_Version'},{ok:!!AREAS[p[0]],l:`Area code first (${Object.keys(AREAS).join(', ')})`},
    {ok:/^[A-Z][A-Za-z0-9]*(-[A-Za-z0-9]+)*$/.test(p[1]||''),l:'Topic in Title-Case-With-Hyphens'},{ok:/^\d{4}-\d{2}-\d{2}$/.test(p[2]||''),l:'Date as YYYY-MM-DD'},{ok:/^v\d+$/.test(p[3]||''),l:'Version as v1, v2, v3'},{ok:!/(final|copy|new|\(\d\))/i.test(n),l:'No "final", "copy", "new" or (2)'}];

function parseDue(l){
  const s = l.toLowerCase(), days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  if (/\btoday\b|end of day/.test(s)) return rel(0);
  if (/\btomorrow\b/.test(s)) return rel(1);
  if (/\bnext week\b/.test(s)) return rel(7);
  const dm = s.match(/\b(\d{1,2})\/(\d{1,2})\b/); if (dm) return `${TODAY.getFullYear()}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;
  for (let i=0;i<7;i++) if (s.includes(days[i])) { const n = (i - TODAY.getDay() + 7) % 7; return rel(n || 7); }
  return '';
}
function extractActions(text){
  const out = [];
  String(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(raw => {
    const l = raw.replace(/^[-*•\d.)\s]+/,'');
    const dec = /\b(decide|decision|approve|sign off|sign-off)\b/i.test(l);
    const act = /^(action|todo)\s*[:\-]/i.test(l) || /\b(will|to send|to share|to update|to book|to chase|to confirm|to draft|to brief|needs? to|agreed to)\b/i.test(l);
    if (!act && !dec) return;
    const owner = OWNERS.find(n => new RegExp('\\b'+n.split(' ')[0]+'\\b','i').test(l)) || '';
    out.push({text:l.replace(/^(action|todo)\s*[:\-]\s*/i,'').replace(/\.$/,''), owner, due:parseDue(l), type:dec?'Decision':'Action', inc:true});
  });
  return out;
}

  ['tasks','issues','content','tickets','sops','jobs'].forEach(k => { const o = OBJ[k]; coll(k).forEach(r => {
    if (isOverdue(o, r)) X.overdue.push({o:k, id:r.id, src:o.one, t:o.title(r), owner:r[o.owner], due:r[o.due]});
    if (isBlocked(o, r)) X.blocked.push({o:k, id:r.id, src:o.one, t:o.title(r), owner:r[o.owner], why:r.blocker}); }); });
  DB.employees.filter(e=>e.onb).forEach(e => ['r30','r60','r90'].forEach(k => { const v = e.onb.reviews[k]; if (!v.done && daysFrom(v.date) < 0) X.overdue.push({o:'employees', id:e.id, src:'Probation review', t:`${k.slice(1)}-day review, ${e.name}`, owner:e.manager, due:v.date}); }));
  DB.transfers.filter(t=>t.status==='Variance').forEach(t => X.blocked.push({o:'transfers', id:t.id, src:'Stock variance', t:`${t.product}: ${t.sent-t.recv} missing`, owner:t.owner, why:'Count before the weekly close'}));
  DB.decisions.filter(d=>d.status==='Pending'||d.status==='More info').forEach(d => X.decide.push({o:'decisions', id:d.id, src:d.area, t:d.title, owner:d.owner, due:d.due}));
  X.overdue.sort((a,b)=>a.due<b.due?-1:1); X.decide.sort((a,b)=>a.due<b.due?-1:1);
  return X;
}

/* ================= Actions ================= */
const ACT = {}, CHG = {}, INP = {};
const TOUR_STEPS = [
  {route:'home', title:'Start with the operating picture', body:'See the sample operating pulse, decisions waiting and where recurring work still depends on one person.'},
  {route:'recruitment/candidates', title:'Use a consistent hiring process', body:'Review candidates against the same five criteria, record evidence and send complete scorecards to the named hiring owner.'},
  {route:'employees/lifecycle', title:'Follow one hire through day 90', body:'See the real hand-offs from approval to offer response, employee setup, access, retail clearance and probation reviews.'},

  {route:'meetings/capture', title:'Turn meeting notes into owned work', body:'Check extracted tasks and decisions, assign owners and dates, then follow progress in one place.'},

];
let TOUR_IDX = -1;
function showIntro(){
  $('#demoEntry').innerHTML = '<div class="entry-card" role="dialog" aria-modal="true" aria-labelledby="entryTitle"><span class="entry-kicker">Glassworks Workroom · prototype</span><h2 id="entryTitle">From founder-held work to an operating system</h2><p>A short, interactive example of how this role could connect recruitment, people, retail operations, meetings and controlled AI workflows.</p><ul><li>Follow a hiring-to-day-90 workflow with linked records</li><li>Try the decision, offer and onboarding hand-offs using fictional data</li><li>Explore the remaining modules from the navigation</li></ul><div class="entry-actions"><button class="btn pri" data-act="startTour">Start 6-step tour</button><button class="btn" data-act="skipIntro">Explore directly</button></div></div>';
  $('#demoEntry').hidden = false;
}
function updateTour(){
  const s = TOUR_STEPS[TOUR_IDX]; if (!s) return;
  const dots = TOUR_STEPS.map((_,i)=>'<i class="'+(i<=TOUR_IDX?'on':'')+'"></i>').join('');
  $('#guidedTour').innerHTML = '<div class="tour-top"><span class="tour-step">Step '+(TOUR_IDX+1)+' of '+TOUR_STEPS.length+'</span><span class="tour-progress">'+dots+'</span></div><h3>'+s.title+'</h3><p>'+s.body+'</p><div class="tour-actions"><button class="btn sm" data-act="finishTour">Exit tour</button><div class="right"><button class="btn sm" data-act="tourBack" '+(TOUR_IDX===0?'disabled':'')+'>Back</button><button class="btn sm pri" data-act="tourNext">'+(TOUR_IDX===TOUR_STEPS.length-1?'Finish':'Next')+'</button></div></div>';
  $('#guidedTour').hidden = false;
  if (location.hash.slice(1) !== s.route) location.hash = s.route;
}
function startTour(){ $('#demoEntry').hidden = true; TOUR_IDX = 0; updateTour(); }
function finishTour(){ TOUR_IDX = -1; $('#guidedTour').hidden = true; try{localStorage.setItem('gw-demo-intro-v1','seen')}catch(e){} }

ACT.candRoute = d => { const c = getRec('candidates', d.id), j = getRec('jobs', c.job) || {}, s = score(c);

    case 'AIT-2': return `Screening summary: ${v[0]||'[candidate]'}, ${v[1]||'[role]'}\n\nEvidence against criteria\n${CRIT.map(k=>`  ${k.n}: ${k.k==='skills'&&v[2]?'From CV: '+v[2].split(/[.\n]/)[0].trim()+'.':'Not evidenced in the CV. Ask at interview.'}`).join('\n')}\n\nRecommendation\n  None. This informs the hiring manager, who decides.`;
    case 'AIT-3': { const s = (v[2]||'').split(/\n|\. /).map(x=>x.trim()).filter(Boolean); return `SOP draft: ${v[0]||'[process]'}\nOwner: ${v[1]||'[owner]'}   Version v0.1   Draft\n\nPurpose\n  So anyone can do this the same way without asking.\n\nSteps\n${(s.length?s:['[step]']).map((x,i)=>`  ${i+1}. ${x.charAt(0).toUpperCase()+x.slice(1)}`).join('\n')}\n\nEvidence it was done\n  [Which tracker is ticked, by whom]\n\nReview\n  Every 6 months by the owner.`; }
    case 'AIT-4': return `${v[0]||'[Product]'}\n\n${v[1]?`Cut in ${v[1].toLowerCase()}, `:''}an easy piece that works harder than it looks. ${v[2]?v[2].charAt(0).toUpperCase()+v[2].slice(1)+'.':''}\n\nCheck against the brand tone guide and confirm composition and care with Product before publishing.`;
    case 'AIT-5': return `Hi ${v[0]||'[name]'},\n\nThank you for getting in touch, and I'm sorry ${v[1]?`about ${v[1].toLowerCase()}`:'for the trouble'}.\n\n[Agent: confirm order details and the current returns window in SOP-102 before sending.]\n\nI've looked into this and [next step]. Reply here if anything else comes up.\n\nBest wishes,\n[Agent name]\nGlassworks Customer Care`;
  }
}

const PAL = ['#1F5C4A','#5E9C84','#D9A23B','#4C7DB0','#C98A75','#7D62AE','#A9CDBE','#8C968F'];
const TC = {ok:'#3FA373',warn:'#E0A93B',bad:'#D9533F',info:'#4C7DB0',vio:'#7D62AE',brand:'#1F5C4A',neu:'#B8C0BA',blush:'#C98A75'};
function spark(vals, color=TC.brand){ const mx=Math.max(...vals), mn=Math.min(...vals); const p=vals.map((v,i)=>`${(i/(vals.length-1)*84).toFixed(1)},${(27-(v-mn)/((mx-mn)||1)*24).toFixed(1)}`);
  return `<svg class="sp" viewBox="0 0 84 30" aria-hidden="true"><polyline points="${p.join(' ')} 84,30 0,30" fill="${color}" opacity=".08"/><polyline points="${p.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`; }
function trend(end, n=8, step=1, seed=3){ const a=[]; for(let i=n-1;i>=0;i--) a.push(Math.max(0, end + i*step + ((i*seed)%3) - 1)); a[n-1]=end; return a; }
function donut(segs, center, sub, size=112){ segs = segs.filter(s=>s.v>0); const tot = segs.reduce((s,x)=>s+x.v,0)||1, r=44, C=2*Math.PI*r; let a=0;
  const arcs = segs.map((s,i)=>{ const len=s.v/tot*C, gap=segs.length>1?2:0; const el=`<circle r="${r}" cx="60" cy="60" fill="none" stroke="${s.c||PAL[i%8]}" stroke-width="13" stroke-dasharray="${Math.max(0,len-gap)} ${C-len+gap}" stroke-dashoffset="${-a}" transform="rotate(-90 60 60)"/>`; a+=len; return el; }).join('');
  return `<div class="donut"><svg viewBox="0 0 120 120" width="${size}" height="${size}" role="img" aria-label="${esc(sub)}"><circle r="${r}" cx="60" cy="60" fill="none" stroke="var(--line2)" stroke-width="13"/>${arcs}<text x="60" y="62" text-anchor="middle" class="dn-v">${center}</text><text x="60" y="78" text-anchor="middle" class="dn-l">${esc(sub)}</text></svg>
  <div class="legend">${segs.map((s,i)=>`<div><i style="background:${s.c||PAL[i%8]}"></i><span>${esc(s.l)}</span><b>${s.v}</b></div>`).join('')}</div></div>`; }
function ring(p, label, color=TC.brand, size=72, href){ const r=30, C=2*Math.PI*r, len=Math.max(0,Math.min(100,p))/100*C;
  const svg = `<svg viewBox="0 0 72 72" width="${size}" height="${size}" aria-hidden="true"><circle r="${r}" cx="36" cy="36" fill="none" stroke="var(--line2)" stroke-width="7"/><circle r="${r}" cx="36" cy="36" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${len} ${C}" transform="rotate(-90 36 36)"/><text x="36" y="41" text-anchor="middle">${Math.round(p)}%</text></svg>`;
  return href ? `<a class="ringc" href="${href}" style="text-decoration:none">${svg}<span>${esc(label)}</span></a>` : `<div class="ringc">${svg}<span>${esc(label)}</span></div>`; }
function bullet(v, target, max, lowerBetter){ const good = lowerBetter ? v <= target : v >= target; return `<div class="bul" title="Target ${target}"><i style="width:${Math.min(100,v/max*100)}%;background:${good?TC.ok:TC.warn}"></i><b style="left:${target/max*100}%"></b></div>`; }
function hbar(rows, max){ max = max || Math.max(1,...rows.map(r=>r.v)); return `<div class="hbar">${rows.map(r=>{ const segs = r.segs || [{v:r.v,c:r.c||TC.brand}];
  const inner = `<span>${esc(r.l)}</span><span class="tr">${segs.map(s=>`<i style="width:${s.v/max*100}%;background:${s.c}"></i>`).join('')}</span><b>${r.v}</b>`; return r.href ? `<a href="${r.href}">${inner}</a>` : `<div class="r">${inner}</div>`; }).join('')}</div>`; }
const box = (title, body, right='') => `<div class="card"><div class="card-h"><h3>${title}</h3>${right}</div><div class="card-b">${body}</div></div>`;
const stack = names => `<span class="stack">${names.slice(0,4).map(n=>av(n)).join('')}</span>`;
const SW = {'GW-KN-0412':'#D9C9A8','GW-DR-1188':'#23263A','GW-TR-0907':'#BDB4A4','GW-CT-0220':'#B5835A','GW-BL-0631':'#F4F2EC','GW-DR-1203':'#A8B59A'};
const swatch = (sku, lg) => `<span class="sw ${lg?'lg':''}" style="background:${SW[sku] || '#'+((parseInt(String(sku).replace(/\D/g,'')||'7',10)*2654435)%0xBBBBBB+0x333333).toString(16).slice(0,6)}"></span>`;

function kpiHtml(list){ return `<div class="kpi-wrap"><div class="sample-note"><b>Sample data</b><span>Illustrative figures</span></div><div class="kpis">${list.map(k => { if (Array.isArray(k)) k = {l:k[0], v:k[1], d:k[2], t:k[3]};
  return `<${k.href?`a href="${k.href}" style="text-decoration:none;color:inherit"`:'div'} class="kpi"><div class="top2"><div><div class="l">${esc(k.l)}</div><div class="v ${k.t||''}">${k.v}</div></div>${k.s?spark(k.s, TC[k.t]||TC.brand):''}</div>

function createStarterFromCandidate(c){
  if(!c) return null;
  const existing=DB.employees.find(e=>e.sourceCandidate===c.id)||(c.employeeId?DB.employees.find(e=>e.id===c.employeeId):null);
  if(existing){c.employeeId=existing.id;return existing;}
  const job=DB.jobs.find(j=>j.id===c.job)||{};
  const start=rel(7);
  const e={id:nextId(DB.employees,'EMP'),name:c.name,role:job.title||'New starter',team:job.team||'Operations',location:job.location||'Remote',manager:job.manager||'Founder',start,status:'Probation',email:c.email||'',sourceCandidate:c.id,
    onb:{checklist:CHECKLIST.map(()=>false),reviews:{r30:{date:addDays(start,30),done:false},r60:{date:addDays(start,60),done:false},r90:{date:addDays(start,90),done:false}}}};
  DB.employees.unshift(e); c.employeeId=e.id; DB.scores[e.id]=DB.scores[e.id]||{};
  log('employees',e.id,'Starter record created from accepted offer','create','Recruitment record '+c.id+' · '+e.role,'System');
  const access={id:nextId(DB.tickets,'ITR'),title:'Device and system access for '+e.name,type:'Access request',who:e.name,owner:'Systems Lead',pri:'High',status:'Open',opened:rel(0),due:addDays(start,-2),blocker:'Confirm role-based access and least-privilege list'};
  DB.tickets.unshift(access); log('tickets',access.id,'Access request raised after accepted offer','create','Access remains pending review; no access is granted by this prototype.','System');
  const items=[
    ['Complete starter checks and employment documents','Aisha Bello',addDays(start,-1)],
    ['Prepare first-week plan and assign a buddy',e.manager,addDays(start,-1)],
    ['Set up device and role-based access','Systems Lead',addDays(start,-2)]
  ];
  if(e.team==='Retail') items.push(['Complete mandatory retail induction before solo floor work',e.manager,addDays(start,2)]);
  items.forEach(x=>{const t={id:nextId(DB.tasks,'TSK'),title:x[0],owner:x[1],due:x[2],status:'Open',blocker:'',ref:{o:'employees',id:e.id}};DB.tasks.unshift(t);log('tasks',t.id,'Starter task assigned to '+x[1],'create','Employee '+e.id+' · '+x[0],'System');});
  return e;
}

function applyDecision(r, v, note){
  r.decided = rel(0); r.note = note || r.note; setField('decisions', r.id, 'status', v, true); log('decisions', r.id, r.owner+': '+v, 'decision', note || undefined, r.owner);
  if (r.ref && r.ref.o === 'sops' && v === 'Approved') { const s=getRec('sops',r.ref.id); if(s){setField('sops',s.id,'status','Approved',true);if(s.version.startsWith('v0'))s.version='v1.0';s.review=rel(180);} }
  if (r.ref && r.ref.o === 'candidates') {
    const c=getRec('candidates',r.ref.id);
    if(c&&v==='Approved'){c.offerApprovedOn=rel(0);c.offerSentOn=null;c.offerResponse=null;setField('candidates',c.id,'stage','Offer',true);log('candidates',c.id,'Offer approved by '+r.owner,'decision',note||'Approval recorded. Record when the offer is sent, then capture the candidate response.',r.owner);}
    if(c&&v==='Declined'){c.closeReason=note||'Hiring owner did not approve progression';setField('candidates',c.id,'stage','Closed',true);log('candidates',c.id,'Hiring decision declined; candidate closed','decision',c.closeReason,r.owner);}
  }
  save();
}
ACT.qd = d => { const r = getRec('decisions', d.id); applyDecision(r, d.v); toast(`${d.v}: ${r.title}`); render(true); };
ACT.decide = d => { const r = getRec('decisions', d.id); const verb = {Approved:'Approve','More info':'Ask for more',Declined:'Decline'}[d.v];
  form({title:`${verb}: ${r.title}`, fields:[{k:'note',l:'Note (optional)',type:'textarea',rows:3}], submit:verb, onSave:v => { applyDecision(r, d.v, v.note); toast(`Recorded: ${d.v}`); }}); };

/* ================= Home: CEO briefing ================= */
function pulse(){
  const X = exceptions(), bad = o => cnt(X.overdue,x=>x.o===o) + cnt(X.blocked,x=>x.o===o);
  const lt = n => n >= 4 ? 'r' : n >= 1 ? 'a' : 'g';
  const items = [
    ['recruitment','brief','Recruitment',cnt(DB.candidates,c=>!['Hired','Closed'].includes(c.stage)),'active candidates',lt(cnt(DB.candidates,c=>-daysFrom(c.since)>5&&!['Hired','Closed'].includes(c.stage)))],
    ['employees','users','People',cnt(DB.employees,e=>e.status==='Probation'),'in probation',lt(cnt(X.overdue,x=>x.o==='employees'))],
    ['training','grad','Training',`${cnt(retail(),e=>cleared(e.id))}/${retail().length}`,'floor-cleared',lt(retail().length-cnt(retail(),e=>cleared(e.id)))],
    ['issues','cart','Ecommerce',cnt(DB.issues,i=>i.status!=='Resolved'),'open issues',lt(bad('issues'))],
    ['transfers','box','Stock',cnt(DB.transfers,t=>t.status==='Variance'),'variances',lt(bad('transfers'))],
    ['content','mega','Marketing',cnt(DB.content,c=>c.stage!=='Live'),'in production',lt(bad('content'))],
    ['tasks','check','Tasks',cnt(DB.tasks,t=>t.status!=='Done'),'open',lt(bad('tasks'))],
    ['sops','book','SOPs',cnt(DB.sops,s=>s.status==='Approved'),'approved',lt(bad('sops'))],
    ['it','monitor','IT',cnt(DB.tickets,t=>t.status!=='Closed'),'open requests',lt(bad('tickets'))],
    ['ai','spark','AI',cnt(DB.airuns,r=>r.status==='Pending review'),'awaiting review',lt(cnt(DB.airuns,r=>r.status==='Pending review'))]];
  return `<div class="pulse">${items.map(([id,icn,n,v,s,l])=>`<a class="pt" href="#${id}"><span class="lt ${l}" title="${l==='g'?'On track':l==='a'?'Watch':'Needs attention'}"></span><span class="h">${ic(icn)}${n}</span><span class="v">${v}</span><span class="s">${s}</span></a>`).join('')}</div>`;
}
Mx('home').page = function(){
  const allX = exceptions(), scoped = r => VIEW_ROLE === 'Systems Lead' || r.owner === ME;
  const X = {overdue:allX.overdue.filter(scoped), blocked:allX.blocked.filter(scoped)};
  const D = depIndex(), done = DB.tasks.filter(t=>t.status==='Done'), ot = pct(cnt(done,t=>!t.doneOn||t.doneOn<=t.due),done.length);
  const h = new Date().getHours(), now = new Date();
  const pend = DB.decisions.filter(d=>['Pending','More info'].includes(d.status) && (VIEW_ROLE === 'Systems Lead' || d.owner === ME)).sort((a,b)=>a.due<b.due?-1:1);
  return `<div class="ph"><div><h1 style="font-size:24px">Good ${h<12?'morning':h<18?'afternoon':'evening'}</h1><p>${TODAY.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</p></div><span class="fresh">Updated ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</span></div>
  <div class="home-demo-note"><b>Sample data</b><span>All people, dates and operating figures are fictional. Role preview: <strong>${esc(VIEW_ROLE)}</strong>; it changes this view only and does not enforce access permissions. <a href="#employees/lifecycle" style="font-weight:700">Explore the hiring-to-day-90 journey →</a></span></div>
  <div class="grid homegrid">
    <a class="card" href="#workflows" style="text-decoration:none;color:inherit"><div class="card-b"><div class="hero">${ring(100-D.pct,'',TC.brand,104).replace(/<span><\/span>/,'')}<div><div class="k">Work moved off the founder</div><div style="font-size:15px;font-weight:800;margin-top:4px">${D.counts[2]+D.counts[3]} of ${D.n} workflows systemised</div><div class="small muted" style="margin-top:6px">Dependency ${D.pct}% · target ≤ 35%</div>${bullet(D.pct,35,100,true)}</div></div>${threadHtml(D)}</div></a>
    ${kpiHtml([{l:VIEW_ROLE==='Systems Lead'?'Overdue':'My overdue', v:X.overdue.length, t:'warn', s:trend(X.overdue.length,8,1.2), dl:['up','−7 this month'], href:'#tasks'},{l:VIEW_ROLE==='Systems Lead'?'Blocked':'My blocked', v:X.blocked.length, t:'warn', s:trend(X.blocked.length,8,0.5), href:'#tasks'},
      {l:'Decisions waiting', v:pend.length, t:'warn', href:'#decisions'},{l:'Tasks on time · all teams', v:`${ot}%`, t:ot>=85?'ok':'warn', b:{v:ot,t:85,max:100}, d:'Target 85%', href:'#tasks'}]).replace('class="kpis"','class="kpis" style="margin:0;grid-auto-flow:row;grid-template-columns:1fr 1fr"')}
  </div>
  ${pend.length?`<div class="spread" style="margin:4px 0 10px"><h3 style="margin:0;font-size:15px">Decide now</h3><a class="small" href="#decisions">All decisions</a></div><div class="qd">${pend.slice(0,3).map(decisionCard).join('')}</div>`:''}
  <h3 style="margin:4px 0 10px;font-size:15px">Business pulse</h3>${pulse()}
  <div class="grid g2 mt">
    <div class="card" id="hx-over"><div class="card-h"><h3>Overdue</h3><span class="pill t-warn nodot">${X.overdue.length}</span></div><div class="card-b xl" style="padding-top:2px;padding-bottom:2px">${X.overdue.slice(0,5).map(x=>xItem(x)).join('')||'<p class="muted">Clear.</p>'}</div></div>
    <div class="card" id="hx-block"><div class="card-h"><h3>Blocked</h3><span class="pill t-warn nodot">${X.blocked.length}</span></div><div class="card-b xl" style="padding-top:2px;padding-bottom:2px">${X.blocked.slice(0,5).map(x=>xItem(x,1)).join('')||'<p class="muted">Clear.</p>'}</div></div>
  </div>`;
};
Mx('reports').desc = 'Weekly operating view';

threadHtml = D => `<div class="thread">${STG.map((s,i)=>`<div class="th${i}" style="flex:${D.counts[i]||0.001}" title="${s}: ${D.counts[i]}">${D.counts[i]||''}</div>`).join('')}</div><div class="row small muted" style="gap:12px;margin-top:8px">${STG.map((s,i)=>`<span class="row" style="gap:5px"><i class="th${i}" style="width:9px;height:9px;border-radius:3px;display:inline-block"></i>${s}</span>`).join('')}</div>`;
/* ================= Router & shell ================= */
let CUR = {};
function modPage(M, tab){
  const ot = (M.objs||[]).map(k => [k, OBJ[k].label, coll(k).length]), et = (M.extra||[]).map(x => [x[0], x[1]]);
  const tabs = M.extraFirst ? [...et, ...ot] : [...ot, ...et];
  if (!tab || !tabs.find(t => t[0] === tab)) tab = tabs[0][0];
  const isObj = OBJ[tab] && (M.objs||[]).includes(tab);
  CUR = {kind: isObj ? 'list' : 'custom', mod:M.id, obj: isObj ? tab : null};
  const k = M.kpis ? M.kpis() : null;
  return `<div class="ph"><div class="tt"><div class="tile">${ic(M.icon)}</div><div><h1>${esc(M.name)}</h1><p>${esc(M.desc||'')}</p></div></div></div>
  ${k && (isObj || tab !== 'lifecycle') ? kpiHtml(k) : ''}
  ${M.insight && (isObj || tab !== 'lifecycle') ? `<div class="ins">${M.insight()}</div>` : ''}
  ${tabs.length > 1 ? `<nav class="otabs">${tabs.map(([t,l,c]) => `<a href="#${M.id}/${t}" aria-current="${t===tab?'page':'false'}">${esc(l)}${c!=null?`<span class="c">${c}</span>`:''}</a>`).join('')}</nav>` : ''}
  ${isObj ? listView(tab) : (M.extra.find(x => x[0] === tab) || [,,()=>''])[2]()}`;
}
function navHtml(activeMod){
  const groups = [...new Set(MODS.map(m => m.group))];
  return groups.map(g => `<div class="ng">${g?`<p>${g}</p>`:''}${MODS.filter(m => m.group === g).map(m => { const b = m.badge ? m.badge() : 0;
    return `<a href="#${m.id}" ${m.id===activeMod?'aria-current="page"':''}>${ic(m.icon)}<span class="l">${esc(m.name)}</span>${b?`<span class="n">${b}</span>`:''}</a>`; }).join('')}</div>`).join('');
}
function render(keep){
  const y = window.scrollY;
  const h = decodeURIComponent(location.hash.slice(1) || 'home'), parts = h.split('/');
  let html, active;
  if (parts[0] === 'r' && OBJ[parts[1]]) {
    const k = parts[1], id = parts[2]; CUR = {kind:'record', obj:k, id};
    if (UI.lastRec !== k+id) { UI.editing = null; UI.lastRec = k+id; }
    const M = MODS.find(m => m.objs && m.objs.includes(k)); active = M ? M.id : 'home';
    html = recordPage(k, id);
    const r = getRec(k, id); document.title = `${r ? OBJ[k].title(r) : 'Not found'} | Glassworks Workroom`;
  } else {
    const M = MODS.find(m => m.id === parts[0]) || MODS[0]; active = M.id;
    html = M.page ? (CUR = {kind:'custom', mod:M.id}, M.page()) : modPage(M, parts[1]);
    document.title = `${M.name} | Glassworks Workroom`;
  }
  $('#page').innerHTML = html;
  $('#nav').innerHTML = navHtml(active);
  const pend = DB.decisions.filter(d => d.status === 'Pending').length;
  $('#inbox').innerHTML = ic('inbox') + (pend ? `<span class="dotn">${pend}</span>` : '');
  bindBoards(); renderBulk();
  window.scrollTo(0, keep ? y : 0);
  $('#side').classList.remove('open');
}
window.addEventListener('hashchange', () => { $('#createDD').classList.remove('show'); if(TOUR_IDX>=0 && location.hash.slice(1)!==TOUR_STEPS[TOUR_IDX].route) finishTour(); render(false); });

document.addEventListener('click', e => {
  if (!e.target.closest('.menuwrap')) $('#createDD').classList.remove('show');
  if (!e.target.closest('#roleMenu')) { $('#roleDD').classList.remove('show'); $('#roleBtn').setAttribute('aria-expanded','false'); }
  if (!e.target.closest('.gsearch')) $('#qres').classList.remove('show');
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  if (t.tagName === 'TR' && e.target.closest('input,select,textarea,button,a')) return;
  if (t.classList.contains('kc') && e.target.closest('a')) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  if (t.tagName === 'BUTTON' || (t.tagName === 'A' && !t.getAttribute('href'))) e.preventDefault();
  fn(t.dataset, t, e);
});
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); t && CHG[t.dataset.chg] && CHG[t.dataset.chg](t.dataset, t, e); });
document.addEventListener('input', e => { const t = e.target.closest('[data-inp]'); t && INP[t.dataset.inp] && INP[t.dataset.inp](t.dataset, t, e); });
document.addEventListener('focusout', e => { if (e.target.matches('[data-chg="pset"]')) { const key = UI.editing; setTimeout(() => { if (UI.editing === key && key) { UI.editing = null; render(true); } }, 150); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#demoEntry').hidden) $('#demoEntry').hidden=true; else if (!$('#guidedTour').hidden) finishTour(); else if ($('#scrim').classList.contains('show')) closeModal(); else if (UI.editing) { UI.editing = null; render(true); } $('#qres').classList.remove('show'); $('#createDD').classList.remove('show'); $('#roleDD').classList.remove('show'); $('#roleBtn').setAttribute('aria-expanded','false'); }
  if (e.key === 'Enter' && e.target.matches('tr[data-act]')) e.target.click();
  if (e.key === 'Enter' && e.target.matches('input[data-chg="pset"]')) e.target.blur();
  if (e.key === '/' && !e.target.closest('input,textarea,select')) { e.preventDefault(); $('#q').focus(); }
});

/* Global search */
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(), box = $('#qres');
  if (q.length < 2) { box.classList.remove('show'); return; }
  const res = [];
  Object.values(OBJ).forEach(o => coll(o.key).forEach(r => { const t = o.title(r); if ((t + ' ' + r.id + ' ' + (o.sub ? o.sub(r) : '')).toLowerCase().includes(q)) res.push({o, r, t}); }));
  MODS.forEach(m => { if (m.name.toLowerCase().includes(q)) res.unshift({m}); });
  box.innerHTML = res.slice(0, 10).map(x => x.m ? `<button data-act="go" data-to="#${x.m.id}">${ic(x.m.icon)}<span>${esc(x.m.name)}</span><span class="k">Module</span></button>`
    : `<button data-act="go" data-to="${recUrl(x.o.key, x.r.id)}">${x.o.avatar ? av(x.t) : ic((MODS.find(m=>m.objs&&m.objs.includes(x.o.key))||{}).icon)}<span>${esc(x.t)}</span><span class="k">${esc(x.o.one)}</span></button>`).join('') || '<div class="muted" style="padding:10px">No matches. Try a name, SKU or document.</div>';
  box.classList.add('show');
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { const b = $('#qres button'); b && b.click(); e.target.value = ''; $('#qres').classList.remove('show'); } });

/* Shell */
$('#createBtn').innerHTML = ic('plus') + 'Create';
$('#createDD').innerHTML = ['candidates','employees','tasks','issues','transfers','content','meetings','sops','files','decisions','tickets','workflows'].map(k => `<button data-act="createObj" data-o="${k}">${ic((MODS.find(m=>m.objs&&m.objs.includes(k))||{}).icon)}${esc(OBJ[k].one)}</button>`).join('');
$('.top .menu').innerHTML = ic('menu');
renderRoleControl();
render(false);
initIntro();
</script></body></html>
